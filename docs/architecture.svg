<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 880" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <!-- ShefGuide system architecture.
       Laid out left to right: the student on the left, the services they never
       touch directly on the right, tiers as labelled columns across the top.
       Kept deliberately high level; the detail lives in the prose. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0C1935"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#174CCF"/>
    </marker>
  </defs>

  <rect width="1640" height="880" fill="#FFFCF6"/>

  <!-- ── tier bands ──────────────────────────────────────────────────── -->
  <g>
    <rect x="272" y="96" width="360" height="716" fill="#F3F1EA"/>
    <rect x="672" y="96" width="400" height="716" fill="#EEF2FF"/>
    <rect x="1112" y="96" width="488" height="716" fill="#F3F1EA"/>
  </g>

  <g font-size="21" font-weight="700" fill="#0C1935" letter-spacing="1.6">
    <text x="292" y="76">TIER 1 · BROWSER</text>
    <text x="692" y="76">TIER 2 · APPLICATION (PYTHON)</text>
    <text x="1132" y="76">TIER 3 · DATA AND EXTERNAL SERVICES</text>
  </g>
  <g stroke="#0C1935" stroke-width="3">
    <path d="M292 88h340M692 88h360M1132 88h448"/>
  </g>

  <!-- ── the student ─────────────────────────────────────────────────── -->
  <g>
    <circle cx="140" cy="404" r="26" fill="#174CCF"/>
    <path d="M96 484a44 44 0 0 1 88 0z" fill="#174CCF"/>
    <text x="140" y="536" font-size="24" font-weight="700" fill="#0C1935" text-anchor="middle">Student</text>
    <text x="140" y="566" font-size="18" fill="#4A5468" text-anchor="middle">International</text>
    <text x="140" y="590" font-size="18" fill="#4A5468" text-anchor="middle">student</text>
  </g>
  <path d="M196 440h72" stroke="#0C1935" stroke-width="3" marker-end="url(#a)" fill="none"/>

  <!-- ── tier 1: React client ────────────────────────────────────────── -->
  <rect x="300" y="128" width="304" height="60" fill="#0C1935"/>
  <text x="452" y="167" font-size="24" font-weight="700" fill="#FFFCF6" text-anchor="middle">React client</text>

  <g font-size="19" fill="#0C1935">
    <rect x="300" y="212" width="304" height="72" fill="#FFFCF6" stroke="#0C1935" stroke-width="2"/>
    <text x="320" y="246">Onboarding checklist</text>
    <text x="320" y="271" font-size="16" fill="#4A5468">12 arrival tasks, personalised</text>

    <rect x="300" y="300" width="304" height="72" fill="#FFFCF6" stroke="#0C1935" stroke-width="2"/>
    <text x="320" y="334">Academic chat</text>
    <text x="320" y="359" font-size="16" fill="#4A5468">Questions and answers</text>

    <rect x="300" y="388" width="304" height="72" fill="#FFFCF6" stroke="#0C1935" stroke-width="2"/>
    <text x="320" y="422">Document upload</text>
    <text x="320" y="447" font-size="16" fill="#4A5468">The student's own brief</text>

    <rect x="300" y="476" width="304" height="72" fill="#FFFCF6" stroke="#0C1935" stroke-width="2"/>
    <text x="320" y="510">Community board</text>
    <text x="320" y="535" font-size="16" fill="#4A5468">Shared questions</text>

    <rect x="300" y="564" width="304" height="72" fill="#FFFCF6" stroke="#0C1935" stroke-width="2"/>
    <text x="320" y="598">Chat history</text>
    <text x="320" y="623" font-size="16" fill="#4A5468">Saved conversations</text>
  </g>

  <!-- browser → backend -->
  <path d="M604 440h68" stroke="#174CCF" stroke-width="4" marker-end="url(#ac)" fill="none"/>
  <text x="638" y="416" font-size="17" font-weight="700" fill="#174CCF" text-anchor="middle">HTTPS</text>
  <text x="638" y="474" font-size="16" fill="#4A5468" text-anchor="middle">JSON</text>

  <!-- ── tier 2: FastAPI backend ─────────────────────────────────────── -->
  <rect x="700" y="128" width="344" height="60" fill="#174CCF"/>
  <text x="872" y="167" font-size="24" font-weight="700" fill="#FFFCF6" text-anchor="middle">FastAPI backend</text>

  <g font-size="19" fill="#0C1935">
    <rect x="700" y="212" width="344" height="86" fill="#FFFCF6" stroke="#174CCF" stroke-width="3"/>
    <text x="720" y="246" font-weight="700">1 · Security layer</text>
    <text x="720" y="271" font-size="16" fill="#4A5468">Prompt-injection filter, PII</text>
    <text x="720" y="291" font-size="16" fill="#4A5468">redaction, rate limiting</text>

    <rect x="700" y="314" width="344" height="86" fill="#FFFCF6" stroke="#174CCF" stroke-width="3"/>
    <text x="720" y="348" font-weight="700">2 · Authentication</text>
    <text x="720" y="373" font-size="16" fill="#4A5468">JWT sessions, bcrypt password</text>
    <text x="720" y="393" font-size="16" fill="#4A5468">hashing, guest mode</text>

    <rect x="700" y="416" width="344" height="86" fill="#FFFCF6" stroke="#174CCF" stroke-width="3"/>
    <text x="720" y="450" font-weight="700">3 · Retrieval (RAG)</text>
    <text x="720" y="475" font-size="16" fill="#4A5468">Searches both sources, keeps</text>
    <text x="720" y="495" font-size="16" fill="#4A5468">the closest passages</text>

    <rect x="700" y="518" width="344" height="86" fill="#FFFCF6" stroke="#174CCF" stroke-width="3"/>
    <text x="720" y="552" font-weight="700">4 · Model router</text>
    <text x="720" y="577" font-size="16" fill="#4A5468">Sends the same prompt to</text>
    <text x="720" y="597" font-size="16" fill="#4A5468">whichever model is selected</text>
  </g>

  <!-- ── tier 3 ──────────────────────────────────────────────────────── -->
  <!-- Connectors are routed orthogonally from the specific backend component
       that talks to each service, rather than from the column edge, so the
       diagram says which part does what. -->
  <!-- storage -->
  <path d="M1044 357h52v-63h44" stroke="#0C1935" stroke-width="3" marker-end="url(#a)" fill="none"/>
  <text x="1070" y="382" font-size="16" fill="#4A5468" text-anchor="middle">reads / writes</text>
  <g>
    <rect x="1140" y="196" width="440" height="60" fill="#0C1935"/>
    <text x="1360" y="235" font-size="24" font-weight="700" fill="#FFFCF6" text-anchor="middle">MongoDB Atlas</text>
    <rect x="1140" y="256" width="440" height="76" fill="#FFFCF6" stroke="#0C1935" stroke-width="2"/>
    <text x="1162" y="288" font-size="18" fill="#0C1935">Accounts · conversations · checklists</text>
    <text x="1162" y="315" font-size="18" fill="#0C1935">uploaded documents · security events</text>
  </g>

  <!-- retrieval sources -->
  <path d="M1044 459h52v28h44" stroke="#0C1935" stroke-width="3" marker-end="url(#a)" fill="none"/>
  <text x="1088" y="449" font-size="16" fill="#4A5468" text-anchor="middle">searches</text>
  <g>
    <rect x="1140" y="376" width="440" height="60" fill="#0C1935"/>
    <text x="1360" y="415" font-size="24" font-weight="700" fill="#FFFCF6" text-anchor="middle">Retrieval sources</text>
    <rect x="1140" y="436" width="216" height="102" fill="#FFFCF6" stroke="#0C1935" stroke-width="2"/>
    <text x="1160" y="470" font-size="19" font-weight="700" fill="#0C1935">Knowledge base</text>
    <text x="1160" y="497" font-size="16" fill="#4A5468">Six curated,</text>
    <text x="1160" y="519" font-size="16" fill="#4A5468">source-referenced files</text>
    <rect x="1364" y="436" width="216" height="102" fill="#FFFCF6" stroke="#0C1935" stroke-width="2"/>
    <text x="1384" y="470" font-size="19" font-weight="700" fill="#0C1935">Uploaded document</text>
    <text x="1384" y="497" font-size="16" fill="#4A5468">The student's own</text>
    <text x="1384" y="519" font-size="16" fill="#4A5468">assignment brief</text>
  </g>

  <!-- LLM providers -->
  <path d="M1044 561h52v124h44" stroke="#174CCF" stroke-width="4" marker-end="url(#ac)" fill="none"/>
  <text x="1088" y="551" font-size="16" font-weight="700" fill="#174CCF" text-anchor="middle">prompt</text>
  <g>
    <rect x="1140" y="582" width="440" height="60" fill="#174CCF"/>
    <text x="1360" y="621" font-size="24" font-weight="700" fill="#FFFCF6" text-anchor="middle">External AI providers</text>
    <rect x="1140" y="642" width="216" height="86" fill="#FFFCF6" stroke="#174CCF" stroke-width="3"/>
    <text x="1248" y="678" font-size="21" font-weight="700" fill="#0C1935" text-anchor="middle">OpenAI</text>
    <text x="1248" y="706" font-size="17" fill="#4A5468" text-anchor="middle">GPT-4o-mini</text>
    <rect x="1364" y="642" width="216" height="86" fill="#FFFCF6" stroke="#174CCF" stroke-width="3"/>
    <text x="1472" y="678" font-size="21" font-weight="700" fill="#0C1935" text-anchor="middle">Google</text>
    <text x="1472" y="706" font-size="17" fill="#4A5468" text-anchor="middle">Gemini 3.5 Flash</text>
  </g>

  <!-- ── the design decision worth stating ───────────────────────────── -->
  <rect x="300" y="754" width="1280" height="58" fill="#0C1935"/>
  <text x="326" y="791" font-size="20" fill="#FFFCF6">
    <tspan font-weight="700">Key decision:</tspan>
    <tspan>  the browser never contacts an AI provider directly. Every request passes through the security layer first.</tspan>
  </text>
</svg>
