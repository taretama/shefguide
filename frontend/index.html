<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShefGuide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: white; border-radius: 12px; padding: 32px; width: 680px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { color: #1A3A5C; font-size: 24px; margin-bottom: 4px; }
    p.sub { color: #888; font-size: 13px; margin-bottom: 24px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #1A3A5C; color: white; margin-right: 8px; }
    .btn-secondary { background: #f0f2f5; color: #333; }
    #chat-box { border: 1px solid #eee; border-radius: 8px; height: 380px; overflow-y: auto; padding: 16px; margin: 16px 0; }
    .msg { padding: 10px 14px; border-radius: 8px; margin: 6px 0; max-width: 88%; font-size: 14px; line-height: 1.5; }
    .user { background: #1A3A5C; color: white; margin-left: auto; }
    .ai { background: #f0f7ee; color: #1C2833; border: 1px solid #d0e8d0; }
    .row { display: flex; gap: 8px; align-items: center; }
    select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    #msg-input { flex: 1; margin-bottom: 0; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 4px; }
    .cloud-badge { background: #E6F1FB; color: #185FA5; }
    .local-badge { background: #EAF3DE; color: #3B6D11; }
    #hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>ShefGuide</h1>
  <p class="sub">AI academic support for international students in UK higher education</p>

  <div id="auth-section">
    <input id="email" type="email" placeholder="University email">
    <input id="password" type="password" placeholder="Password">
    <button class="btn-primary" onclick="login()">Log in</button>
    <button class="btn-secondary" onclick="register()">Register</button>
    <p id="auth-msg" style="color:#c00;font-size:13px;margin-top:8px"></p>
  </div>

  <div id="chat-section" style="display:none">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
   <select id="model" onchange="updateBadge()">
    <option value="gpt">GPT-4o-mini — OpenAI</option>
    <option value="gemini">Gemini 2.5 Flash — Google</option>
   </select>

   <span id="model-badge"
         style="font-size:11px;padding:3px 8px;border-radius:4px;
                background:#E6F1FB;color:#0C447C">
     OpenAI servers
   </span>
</div>

<a href="qa.html"
     style="display:inline-block;margin-bottom:14px;font-size:13px;
            color:#148F77;background:#EAF3DE;padding:6px 12px;
            border-radius:6px;text-decoration:none">
    Community Q&A — ask questions, get AI answers
</a>

<div id="chat-box"></div>

<div class="row">
  <input id="msg-input" placeholder="Ask about assignments, referencing, UK academic life..." onkeydown="if(event.key==='Enter')send()">
  <button class="btn-primary" onclick="send()">Send</button>
</div>


<!-- DOCUMENT EXPLAINER START -->
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #eee">

  <p style="font-size:13px;font-weight:500;color:#1A3A5C;margin-bottom:8px">
    Document Explainer — upload an assignment brief or policy PDF
  </p>

  <input type="file" id="pdf-file" accept=".pdf"
         style="font-size:13px;margin-bottom:8px">

  <button onclick="uploadDoc()"
          style="background:#1A3A5C;color:white;border:none;
                 padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer">
    Upload PDF
  </button>

  <span id="upload-status"
        style="font-size:12px;color:#666;margin-left:8px"></span>


  <div id="doc-section" style="display:none;margin-top:12px">

    <input id="doc-q" type="text"
           placeholder="Ask a question about your document..."
           style="width:74%;padding:8px;border:1px solid #ddd;
                  border-radius:6px;font-size:13px"
           onkeydown="if(event.key==='Enter')askDoc()">

    <button onclick="askDoc()"
            style="background:#148F77;color:white;border:none;
                   padding:8px 14px;border-radius:6px;font-size:13px;
                   cursor:pointer;margin-left:6px">
      Ask
    </button>

    <div id="doc-reply"
         style="display:none;margin-top:10px;padding:12px;
                background:#f0fdf4;border-radius:6px;
                font-size:13px;line-height:1.6">
    </div>

  </div>

</div>
<!-- DOCUMENT EXPLAINER END -->
</div> 

<script>
const API = 'http://localhost:8000';
let token = '', sessionId = null, messages = [];

function updateBadge() {
  const model = document.getElementById('model').value;
  const badge = document.getElementById('model-badge');

  if (model === 'gemini') {
    badge.textContent = 'Google servers';
    badge.style.background = '#EAF3DE';
    badge.style.color = '#27500A';
  } else {
    badge.textContent = 'OpenAI servers';
    badge.style.background = '#E6F1FB';
    badge.style.color = '#0C447C';
  }
}

async function register() {
  const r = await fetch(API + '/auth/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      university: 'University of Sheffield',
      home_country: 'Nigeria',
      programme: 'MSc Cybersecurity and AI'
    })
  });
  const d = await r.json();
  if (d.token) { token = d.token; showChat(); }
  else document.getElementById('auth-msg').textContent = d.detail || 'Error';
}

async function login() {
  const r = await fetch(API + '/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    })
  });
  const d = await r.json();
  if (d.token) { token = d.token; showChat(); }
  else document.getElementById('auth-msg').textContent = 'Wrong email or password';
}

function showChat() {
  localStorage.setItem('shefguide_token', token);
  document.getElementById('auth-section').style.display = 'none';
  document.getElementById('chat-section').style.display = 'block';
  addMsg('ShefGuide', "Hello! I'm here to help with UK academic life. Ask me anything about assignments, referencing, academic culture, or staying safe when using AI tools.");
}

async function send() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();

  if (!text) return;

  const model = document.getElementById('model').value;

  input.value = '';

  addMsg('You', text);

  messages.push({
    role: 'user',
    content: text
  });

  const r = await fetch(API + '/chat', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({
      messages,
      model,
      session_id: sessionId
    })
  });

  const d = await r.json();

  if (!r.ok || !d.reply) {
    addMsg('ShefGuide (error)', 'Something went wrong: ' + (d.detail ? JSON.stringify(d.detail) : 'unknown error'));
    return;
  }

  sessionId = d.session_id;

  messages.push({
    role: 'assistant',
    content: d.reply
  });

  addMsg('ShefGuide (' + d.model_used + ')', d.reply);
}

function addMsg(from, text) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'msg ' + (from === 'You' ? 'user' : 'ai');
  div.innerHTML = (from !== 'You' ? '<strong>' + from + ':</strong><br>' : '') + text.replace(/\n/g, '<br>');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function uploadDoc() {
  const fileInput = document.getElementById('pdf-file');
  const status    = document.getElementById('upload-status');
  if (!fileInput.files[0]) {
    status.textContent = 'Please select a PDF first.';
    return;
  }
  const form = new FormData();
  form.append('file', fileInput.files[0]);
  status.textContent = 'Uploading...';

  const r = await fetch(API + '/document/upload', {
    method:  'POST',
    headers: { Authorization: 'Bearer ' + token },
    body:    form
  });
  const d = await r.json();

  if (r.ok) {
    status.textContent = `Uploaded: ${d.word_count} words`;
    status.style.color = '#148F77';
    document.getElementById('doc-section').style.display = 'block';
  } else {
    status.textContent = d.detail || 'Upload failed';
    status.style.color = '#c00';
  }
}

async function askDoc() {
  const question  = document.getElementById('doc-q').value.trim();
  const replyBox  = document.getElementById('doc-reply');
  const model     = document.getElementById('model').value;
  if (!question) return;

  replyBox.style.display = 'block';
  replyBox.textContent   = 'Thinking...';

  const r = await fetch(API + '/document/ask', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json',
               'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ question, model })
  });
  const d = await r.json();
  replyBox.innerHTML = d.reply.replace(/\n/g, '<br>');
}

</script>
</body>
</html>
